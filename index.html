<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball Blast - Extreme Speed</title>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Titan One', cursive; touch-action: none; }
        canvas { display: block; }
        #shop-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0081C9; display: flex; flex-direction: column; align-items: center; z-index: 200;
        }
        .header { width: 100%; display: flex; justify-content: space-around; padding: 20px; background: #005A8C; color: white; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; width: 90%; }
        .card { background: #143F6B; border: 3px solid #FBCB0A; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; color: white; cursor: pointer; }
        .battle-btn { background: linear-gradient(#FFD700, #FFA500); border: none; padding: 15px 80px; border-radius: 40px; font-size: 24px; box-shadow: 0 5px 0 #CC8400; cursor: pointer; margin-top: 20px; }
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; z-index: 300; }
    </style>
</head>
<body>

    <div id="shop-ui">
        <div class="header">
            <div>💰 <span id="gold-val">5059</span></div>
            <div>💎 352</div>
        </div>
        <h2 style="color: white; margin-top: 20px;">MAX UPGRADES</h2>
        <div class="shop-grid">
            <div class="card" onclick="upgradeSpeed()">
                <div style="font-size: 30px;">⚡</div>
                <div>ULTRA SPEED</div>
                <div style="color: #FFD700;">💰 <span id="speed-cost">200</span></div>
            </div>
            <div class="card" onclick="upgradePower()">
                <div style="font-size: 30px;">🔥</div>
                <div>POWER</div>
                <div style="color: #FFD700;">💰 <span id="power-cost">300</span></div>
            </div>
        </div>
        <button class="battle-btn" onclick="startGame()">BATTLE</button>
    </div>

    <div id="game-over">
        <h1 style="color: white; font-size: 50px;">CRASHED!</h1>
        <button class="battle-btn" style="position: static;" onclick="showShop()">RETRY</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gold = 5059, gameActive = false, frame = 0;
    let bullets = [], enemies = [], coins = [];
    let player = { x: 0, y: 0 };
    let mouse = { x: 0 };

    // --- EXTREME SPEED SETTINGS ---
    let fireInterval = 10;      // Survatichi speed
    let bulletTravelSpeed = 18; // Goli kiti fast var jaate
    let bulletPower = 1.2;
    let s_cost = 200, p_cost = 300;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, type, dur, vol = 0.05) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function upgradeSpeed() {
        if (gold >= s_cost) {
            gold -= s_cost;
            // Firing interval kami kela (Speed vadhavli)
            fireInterval = Math.max(1, fireInterval - 1.2); 
            // Goli cha var janyacha veg vadhavla
            bulletTravelSpeed += 3; 
            s_cost = Math.floor(s_cost * 1.5);
            updateUI();
            playSfx(900, 'sine', 0.2, 0.1);
        }
    }

    function upgradePower() {
        if (gold >= p_cost) {
            gold -= p_cost;
            bulletPower += 0.8;
            p_cost = Math.floor(p_cost * 1.5);
            updateUI();
            playSfx(1100, 'sine', 0.2, 0.1);
        }
    }

    function updateUI() {
        document.getElementById('gold-val').innerText = Math.floor(gold);
        document.getElementById('speed-cost').innerText = s_cost;
        document.getElementById('power-cost').innerText = p_cost;
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height - 120;
    }
    window.addEventListener('resize', resize);
    resize();

    function startGame() {
        document.getElementById('shop-ui').style.display = 'none';
        enemies = []; bullets = []; coins = [];
        gameActive = true;
        loop();
    }

    function showShop() {
        document.getElementById('shop-ui').style.display = 'flex';
        document.getElementById('game-over').style.display = 'none';
        gameActive = false;
    }

    function spawnEnemy() {
        const size = 60 + Math.random() * 50;
        enemies.push({
            x: Math.random() * (canvas.width - size), y: -size,
            size: size, hp: Math.floor(Math.random() * 60) + 20,
            color: `hsl(${Math.random() * 360}, 80%, 55%)`,
            vx: (Math.random() - 0.5) * 6, vy: 3, gravity: 0.18
        });
    }

    function update() {
        if (!gameActive) return;
        frame++;
        if (frame % 70 === 0) spawnEnemy();
        player.x += (mouse.x - player.x) * 0.25;

        // ULTRA FIRE RATE
        if (frame % Math.floor(fireInterval) === 0) {
            bullets.push({ x: player.x, y: player.y - 45 });
            playSfx(500, 'sine', 0.04, 0.02);
        }

        bullets.forEach((b, i) => {
            b.y -= bulletTravelSpeed;
            if (b.y < -20) bullets.splice(i, 1);
        });

        coins.forEach((c, i) => {
            c.y += 6;
            if (Math.hypot(c.x - player.x, c.y - player.y) < 45) {
                gold += 15;
                updateUI();
                playSfx(1200, 'sine', 0.1, 0.1);
                coins.splice(i, 1);
            }
        });

        enemies.forEach((e, i) => {
            e.x += e.vx; e.y += e.vy; e.vy += e.gravity;
            if (e.x < 0 || e.x + e.size > canvas.width) e.vx *= -1;
            if (e.y + e.size > canvas.height - 100) e.vy = -Math.abs(e.vy) * 0.95;

            if (Math.hypot((e.x + e.size/2) - player.x, (e.y + e.size/2) - player.y) < (e.size/2 + 25)) {
                gameActive = false;
                document.getElementById('game-over').style.display = 'flex';
            }

            bullets.forEach((b, bi) => {
                if (b.x > e.x && b.x < e.x + e.size && b.y > e.y && b.y < e.y + e.size) {
                    e.hp -= bulletPower;
                    bullets.splice(bi, 1);
                    if (e.hp <= 0) {
                        for(let j=0; j<3; j++) coins.push({x: e.x + Math.random()*20, y: e.y + Math.random()*20});
                        enemies.splice(i, 1);
                    }
                }
            });
        });
    }

    function draw() {
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

        // Cannon
        ctx.fillStyle = '#333'; ctx.fillRect(player.x - 12, player.y - 50, 24, 50);
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(player.x - 25, player.y, 22, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(player.x + 25, player.y, 22, 0, Math.PI*2); ctx.fill();

        // Shiny Coins
        coins.forEach(c => {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.stroke();
        });

        // Rocks
        enemies.forEach(e => {
            ctx.fillStyle = e.color;
            ctx.beginPath();
            for(let j=0; j<8; j++) {
                let ang = j * Math.PI * 2 / 8;
                let px = (e.x + e.size/2) + (e.size/2) * Math.cos(ang);
                let py = (e.y + e.size/2) + (e.size/2) * Math.sin(ang);
                if(j==0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = `bold ${e.size/3}px Arial`;
            ctx.textAlign = 'center'; ctx.fillText(Math.ceil(e.hp), e.x + e.size/2, e.y + e.size/1.6);
        });

        // Bullets
        ctx.fillStyle = 'white';
        bullets.forEach(b => ctx.fillRect(b.x-4, b.y, 8, 15));
    }

    function loop() {
        if (!gameActive) return;
        update(); draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('pointermove', (e) => { mouse.x = e.clientX; });
    loop();
</script>
